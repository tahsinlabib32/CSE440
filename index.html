<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Outcome Predictor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#15803d', // Dark green accent
                        'primary-hover': '#166534',
                        background: '#fafafa', // Soft white/zinc-50 base
                        surface: '#ffffff',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'float': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth scrolling and base styling */
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Subtle Mesh Gradient Background */
        .mesh-bg {
            background-color: #fafafa;
            background-image: 
                radial-gradient(at 10% 0%, hsla(142, 69%, 95%, 1) 0px, transparent 50%),
                radial-gradient(at 90% 100%, hsla(142, 69%, 95%, 1) 0px, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="mesh-bg text-zinc-900 min-h-screen flex items-center justify-center p-6 antialiased selection:bg-green-200 selection:text-green-900">

    <!-- Main Card Container -->
    <main class="w-full max-w-2xl bg-surface/80 backdrop-blur-xl rounded-2xl shadow-float border border-white/60 p-8 sm:p-12 transition-all duration-300">
        
        <!-- Header Section -->
        <header class="mb-8 text-center relative">
            <div class="inline-flex items-center justify-center p-3 bg-green-50 rounded-2xl mb-5 shadow-sm border border-green-100">
                <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-zinc-900 mb-3">Legal Outcome Predictor</h1>
            <p class="text-zinc-500 text-sm max-w-md mx-auto leading-relaxed">
                Test our Logistic Regression (LR) model. Enter case details below or use our sample data to predict the legal classification (e.g., Cited, Distinguished).
            </p>
        </header>

        <!-- Form Section -->
        <div class="space-y-6">
            
            <!-- Case Title Input -->
            <div class="space-y-2 group">
                <label for="caseTitle" class="block text-sm font-semibold text-zinc-700 tracking-wide">Case Title <span class="text-zinc-400 font-normal">(Optional)</span></label>
                <input 
                    type="text" 
                    id="caseTitle" 
                    placeholder="e.g. Smith v. Industrial Corp" 
                    class="w-full px-4 py-3.5 bg-white border border-zinc-200 rounded-xl text-zinc-800 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 shadow-sm group-hover:border-zinc-300"
                >
            </div>

            <!-- Case Text Input with File Upload -->
            <div class="space-y-2 group">
                <div class="flex justify-between items-end mb-1">
                    <label for="caseText" class="block text-sm font-semibold text-zinc-700 tracking-wide">Case Text / Summary</label>
                    
                    <!-- File Upload Button -->
                    <label for="fileUpload" class="cursor-pointer inline-flex items-center text-xs font-medium text-primary hover:text-primary-hover transition-colors duration-200">
                        <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        Upload .txt file
                        <input type="file" id="fileUpload" accept=".txt" class="hidden" onchange="handleFileUpload(event)">
                    </label>
                </div>
                
                <textarea 
                    id="caseText" 
                    placeholder="Paste the full text or summary of the legal ruling here to test the model..." 
                    class="w-full px-4 py-3.5 bg-white border border-zinc-200 rounded-xl text-zinc-800 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 shadow-sm min-h-[160px] resize-y group-hover:border-zinc-300"
                    required
                ></textarea>
            </div>

            <!-- Testing Actions (Examples & Clear) -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                <div class="flex flex-wrap items-center gap-2">
                    <select id="sampleSelect" class="text-xs font-medium px-3 py-1.5 rounded-lg bg-zinc-100 text-zinc-600 border border-zinc-200/60 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200">
                        <option value="" disabled selected>Select a test class...</option>
                        <option value="affirmed">Affirmed</option>
                        <option value="applied">Applied</option>
                        <option value="approved">Approved</option>
                        <option value="cited">Cited</option>
                        <option value="considered">Considered</option>
                        <option value="discussed">Discussed</option>
                        <option value="distinguished">Distinguished</option>
                        <option value="followed">Followed</option>
                        <option value="referred to">Referred To</option>
                        <option value="related">Related</option>
                    </select>
                    <button 
                        type="button" 
                        onclick="loadSelectedExample()" 
                        class="inline-flex items-center text-xs font-medium px-3 py-1.5 rounded-lg bg-primary/10 text-primary hover:bg-primary/20 transition-colors duration-200 border border-primary/20"
                    >
                        Load Sample
                    </button>
                </div>
                
                <button 
                    type="button" 
                    onclick="clearForm()" 
                    class="inline-flex items-center text-xs font-medium px-3 py-1.5 text-zinc-400 hover:text-red-500 transition-colors duration-200"
                >
                    <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Clear Form
                </button>
            </div>

            <!-- Primary CTA -->
            <div class="pt-4">
                <button 
                    id="predictBtn" 
                    onclick="makePrediction()" 
                    class="w-full relative flex items-center justify-center px-6 py-4 bg-primary text-white font-semibold text-lg rounded-xl hover:bg-primary-hover active:scale-[0.98] transition-all duration-200 shadow-sm hover:shadow group overflow-hidden disabled:opacity-70 disabled:cursor-not-allowed"
                >
                    <span id="btnText">Run Model Prediction</span>
                    <svg id="loadingSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden absolute" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>

            <!-- Error Message -->
            <div id="errorMsg" class="hidden mt-4 p-4 rounded-xl bg-red-50 border border-red-100 text-red-600 text-sm font-medium flex items-start">
                <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="errorText"></span>
            </div>

            <!-- Result Box -->
            <div id="resultBox" class="hidden mt-6 overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-soft transition-all duration-300 transform translate-y-0 opacity-100">
                <div class="p-6 sm:p-8 flex justify-between items-end">
                    <div>
                        <p class="text-xs font-bold tracking-widest text-zinc-400 uppercase mb-2">Model Prediction</p>
                        <div class="flex items-center">
                            <div class="w-2 h-10 bg-primary rounded-full mr-4"></div>
                            <h2 id="predictionValue" class="text-2xl sm:text-3xl font-extrabold text-zinc-900 tracking-tight">-</h2>
                        </div>
                    </div>
                    
                    <!-- Confidence Score Ring -->
                    <div id="confidenceBox" class="hidden text-right">
                        <p class="text-[10px] font-bold tracking-widest text-zinc-400 uppercase mb-1">Confidence</p>
                        <div class="inline-flex items-center justify-center bg-green-50 text-primary font-bold text-lg px-3 py-1.5 rounded-lg border border-green-100">
                            <span id="confidenceValue">--%</span>
                        </div>
                    </div>
                </div>
                <div class="bg-zinc-50 px-6 py-3 border-t border-zinc-100">
                    <p class="text-xs text-zinc-500 font-medium flex items-center">
                        <svg class="w-3.5 h-3.5 mr-1.5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Logistic Regression analysis complete
                    </p>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        const sampleData = {
            "applied": {
                "title": "Australian Broadcasting Corporation v O'Neill [2006] HCA 46",
                "text": "recent decision of the High Court in Australian Broadcasting Corporation v O'Neill [2006] HCA 46 clarifies this issue. Gleeson CJ and Crennan J (at [19]), after referring to various cases dealing with the grant of interlocutory injunctions in cases of defamation, formulated the general principles governing the grant of such relief in the following terms: \"in all applications for an interlocutory injunction, a court will ask whether the plaintiff has shown that there is a serious question to be tried as to the plaintiff's entitlement to relief, has shown that the plaintiff is likely to suffer injury for which damages will not be an adequate remedy, and has shown that the balance of convenience favours the granting of an injunction.\""
            },
            "followed": {
                "title": "Hexal Australia Pty Ltd v Roche Therapeutics Inc (2005) 66 IPR 325",
                "text": "Hexal Australia Pty Ltd v Roche Therapeutics Inc (2005) 66 IPR 325, the likelihood of irreparable harm was regarded by Stone J as, indeed, a separate element that had to be established by an applicant for an interlocutory injunction. Her Honour cited the well-known passage from the judgment of Mason ACJ in Castlemaine Tooheys Ltd v South Australia [1986] HCA 58 ; (1986) 161 CLR 148 (at 153) as support for that proposition. Had it not been for the fact that there will be a speedy trial of this matter, which Stone J regarded as a relevant consideration in Hexal v Roche (at [78]), I might have been inclined to grant some, at least, of the orders sought by CSL. I will give the parties an opportunity to be heard in relation to the matter of costs. I certify that the preceding one hundred and se..."
            },

            },
            "related": {
                "title": "Hayes, in the matter of Estate Property Group Limited [2007] FCA 935 ",
                "text": "On 15 June 2007 I made orders extending the convening period for the meeting of creditors required to be held under s 439A of the Corporations Act 2001 (Cth) (the Act) to midnight 23 July 2007 in relation to a number of companies, being the members of what is known as the Estate Property Group (the Group), together with some ancillary orders on the application of the administrators of the companies in the Group (the Administrators) ( Hayes, in the matter of Estate Property Group Limited (Administrators Appointed) [2007] FCA 935). In a related application concerning Australian Capital Reserve Limited (Administrators Appointed) (ACR), on 12 June 2007 orders were made extending the \"decision period\" provided for by s 441A(1)(b) of the Act to the last day of the convening period for a number o..."
            },
            "considered": {
                "title": "Australian Securities and Investments Commission v Pegasus Leveraged Options Group Pty Ltd (2002) 41 ACSR 561",
                "text": "In Australian Securities and Investments Commission v Pegasus Leveraged Options Group Pty Ltd (2002) 41 ACSR 561 at 574 (\" Pegasus \"), Davies AJ addressed the question whether the sole director of the company which promoted and operated a managed investment scheme should also be considered to be a person operating the scheme. His Honour said at [55]-[57]: \"The word 'operate' is an ordinary word of the English language and, in the context, should be given its meaning in ordinary parlance. The term is not used to refer to ownership or proprietorship but rather to the acts which constitute the management of or the carrying out of the activities which constitute the managed investment scheme. The Oxford English Dictionary gives these relevant meanings: 5. To effect or produce by action or the ..."

            "discussed": {
                "title": "Foster v Australian Competition and Consumer Commission [2006] FCAFC 21",
                "text": "Most recently, in Foster v Australian Competition and Consumer Commission [2006] FCAFC 21 , a Full Court (comprising Ryan, Finn and Allsop JJ) noted the apparent tension between the view expressed by Lockhart and Gummow JJ in ICI . Their Honours said at [30]-[31]: \"His Honour's reference to terms having 'an operation outside the boundaries of s 80 ' is no more than a paraphrase of the actual words of the subsection 'such terms as the Court determines to be appropriate.' That paraphrase, we consider with respect, does not illuminate the amplitude which should be given, as a matter of construction, to the grant of power. In our view, a more helpful guide to resolving the question of construction is afforded by this observation, also from ICI v Trade Practices Commission , of Lockhart J (with..."
            },
            "distinguished": {
                "title": "Patterson, Re; Ex parte Taylor (2001) 207 CLR 291",
                "text": "The applicant submits that the question whether the Treasurer is satisfied that an acquisition is contrary to the national interest is a jurisdictional fact and that it is not made out if the matters the Treasurer took into account do not support a reasonable and rational conclusion to that effect. She referred to the reasons for judgment of Kirby J in Re Patterson; Ex parte Taylor (2001) 207 CLR 291, in particular at 504-505 [338]. The reasons of Kirby J do seem to support the submission advanced by the applicant, but I would not apply them in this case. None of the other Justices in Re Patterson; Ex parte Taylor (supra) took a similar approach. For example, Gaudron J, who did discuss the concept of national interest, decided the case on the basis that the Minister asked herself the wrong..."

            "affirmed": {

                "text": "This is an appeal from a decision of the Federal Magistrates Court which dismissed an application for review of a decision of the Refugee Review Tribunal affirming a decision of a delegate of the Minister to refuse the appellant a protection visa. The nature of the appellant's protection visa application, the reasons of the Tribunal and the Federal Magistrate are set out in more detail in the Federal Magistrate's decision, SZJXC v the Minister for Immigration and Citizenship [2006] FMCA 545 , which is available on the internet. 2 The appellant is a citizen of the People's Republic of China and his claim to be a refugee rests on an alleged fear of persecution based on his involvement in the practice of Falun Gong. 3 In his protection visa application he claimed to have been a member of Falu..."

                "title": "Riverstone Computer Services Pty Ltd v IBM Global Financing Australia Limited [2002] FCA 1608",

            "cited": {
                "title": "Dais Studio Pty Ltd v Bullett Creative Pty Ltd [2008] FCA 42",
                "text": "The general principles governing the exercise of the discretion to award indemnity costs after rejection by an unsuccessful party of a so called Calderbank letter were set out in the judgment of the Full Court in Black v Lipovac [1998] FCA 699 ; (1998) 217 ALR 386. In summary those principles are: 1. Mere refusal of a \"Calderbank offer\" does not itself warrant an order for indemnity costs. In this connection it may be noted that Jessup J in Dais Studio Pty Ltd v Bullet Creative Pty Ltd [2008] FCA 42 said that (at [6]): if the rejection of such an offer is to ground a claim for indemnity costs, it must be by reason of some circumstance other than that the offer happened to comply with the Calderbank principle. 2. To obtain an order for indemnity costs the offeror must show that the refusal to accept it was unreasonable. 3. The reasonableness of the conduct of the offeree is to be viewed in the light of the circumstances that existed when the offer was rejected."
            }
        };

        function loadSelectedExample() {
            const select = document.getElementById('sampleSelect');
            const type = select.value;
            if (!type || !sampleData[type]) return;
            
            const titleInput = document.getElementById('caseTitle');
            const textInput = document.getElementById('caseText');
            
            titleInput.value = sampleData[type].title;
            textInput.value = sampleData[type].text;
            
            triggerHighlight([titleInput, textInput]);
            hideResults();
        }

        function clearForm() {
            document.getElementById('caseTitle').value = "";
            document.getElementById('caseText').value = "";
            hideResults();
        }

        function triggerHighlight(elements) {
            elements.forEach(el => {
                el.classList.add('ring-2', 'ring-primary/20', 'border-primary');
                setTimeout(() => {
                    el.classList.remove('ring-2', 'ring-primary/20', 'border-primary');
                }, 400);
            });
        }

        function hideResults() {
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const textInput = document.getElementById('caseText');
                const titleInput = document.getElementById('caseTitle');
                
                textInput.value = e.target.result;
                // Auto-fill title with filename (without extension) if empty
                if (!titleInput.value) {
                    titleInput.value = file.name.replace(/\.[^/.]+$/, "");
                }
                
                triggerHighlight([textInput, titleInput]);
                hideResults();
            };
            reader.readAsText(file);
            
            // Reset file input so the same file can be uploaded again if needed
            event.target.value = '';
        }

        async function makePrediction() {
            const title = document.getElementById('caseTitle').value.trim();
            const text = document.getElementById('caseText').value.trim();
            const btn = document.getElementById('predictBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const resultBox = document.getElementById('resultBox');
            const predictionValue = document.getElementById('predictionValue');
            const confidenceBox = document.getElementById('confidenceBox');
            const confidenceValue = document.getElementById('confidenceValue');

            if (!text) {
                errorText.textContent = "Please provide the case text to analyze.";
                errorMsg.classList.remove('hidden');
                return;
            }

            // Loading state
            btn.disabled = true;
            btnText.classList.add('opacity-0');
            spinner.classList.remove('hidden');
            errorMsg.classList.add('hidden');
            
            // Hide result with animation
            resultBox.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => resultBox.classList.add('hidden'), 300);

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ case_title: title, case_text: text })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || "Prediction failed. Server returned an error.");
                }

                const data = await response.json();
                
                // Show result
                predictionValue.textContent = data.prediction.toUpperCase();
                
                // Show confidence if available
                if (data.confidence) {
                    const pct = (data.confidence * 100).toFixed(1);
                    confidenceValue.textContent = `${pct}%`;
                    confidenceBox.classList.remove('hidden');
                } else {
                    confidenceBox.classList.add('hidden');
                }
                
                // Animate result in
                resultBox.classList.remove('hidden');
                // Trigger reflow
                void resultBox.offsetWidth;
                resultBox.classList.remove('opacity-0', 'translate-y-4');
                
            } catch (error) {
                errorText.textContent = error.message;
                errorMsg.classList.remove('hidden');
            } finally {
                // Restore button
                btn.disabled = false;
                btnText.classList.remove('opacity-0');
                spinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
